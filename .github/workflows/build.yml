name: Build Meloasis iPhone IPA

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: 'Root approved the frozen source, passing native tests and visual evidence'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cadentide-ios-public-encrypted-build
  cancel-in-progress: false

jobs:
  build-ios:
    if: inputs.release_authorized == true
    name: Signed Meloasis IPA
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CADENTIDE_MARKETING_VERSION: "4.5"
      CADENTIDE_BUILD_NUMBER: "52"

    defaults:
      run:
        shell: bash
        working-directory: products/cadentide

    steps:
      - name: Check out encrypted payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require populated native verification receipt
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          receipt = json.load(open('MELOASIS_RELEASE_PROVENANCE.json'))
          assert receipt['version'] == '4.5' and receipt['build'] == 52
          assert receipt['verifiedNativeRun'] > 0
          assert len(receipt['verifiedNativeCommit']) == 40
          assert len(receipt['encryptedOverlaySHA256']) == 64
          assert receipt['expectedNativeTests'] >= 208
          assert receipt['visualEvidenceReviewed'] is True
          PY

      - name: Require successful source-only native verification
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFIED_RUN="$(python3 -c "import json; print(json.load(open('MELOASIS_RELEASE_PROVENANCE.json'))['verifiedNativeRun'])")"
          VERIFIED_COMMIT="$(python3 -c "import json; print(json.load(open('MELOASIS_RELEASE_PROVENANCE.json'))['verifiedNativeCommit'])")"
          gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha > "$RUNNER_TEMP/verified-run.json"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/MELOASIS_PROVENANCE.json?ref=$VERIFIED_COMMIT" > "$RUNNER_TEMP/verified-source.json"
          python3 - "$RUNNER_TEMP/verified-run.json" "$RUNNER_TEMP/verified-source.json" <<'PY'
          import json, sys
          provenance = json.load(open('MELOASIS_RELEASE_PROVENANCE.json'))
          run = json.load(open(sys.argv[1]))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['headSha'] == provenance['verifiedNativeCommit']
          verified_source = json.load(open(sys.argv[2]))
          for key in ['version', 'build', 'sourceFileCount', 'expectedNativeTests', 'encryptedOverlaySHA256']:
              assert verified_source[key] == provenance[key], 'Release differs from native-tested source: ' + key
          PY

      - name: Decrypt existing private build envelope after native PASS
        working-directory: .
        env:
          CADENTIDE_ARCHIVE_SECRET: ${{ secrets.CADENTIDE_ARCHIVE_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          receipt = json.load(open('MELOASIS_RELEASE_PROVENANCE.json'))
          assert hashlib.sha256(pathlib.Path('cadentide-project.enc').read_bytes()).hexdigest().upper() == receipt['signingPayloadSHA256']
          PY
          test -n "$CADENTIDE_ARCHIVE_SECRET"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in cadentide-project.enc \
            -out "$RUNNER_TEMP/cadentide-project.zip" \
            -pass env:CADENTIDE_ARCHIVE_SECRET
          unzip -q "$RUNNER_TEMP/cadentide-project.zip"
          test -s products/cadentide/ios/Cadentide.xcodeproj/project.pbxproj
          test -s signing/dist-cert.p12
          test -s signing/profile.mobileprovision
          test -s signing/credentials.json

      - name: Install encrypted Meloasis 4.5 source
        working-directory: .
        env:
          CADENTIDE_OVERLAY_SECRET: ${{ secrets.MELOASIS_SOURCE_VERIFY_45_BUILD52_20260923 }}
        run: |
          set -euo pipefail
          test -n "$CADENTIDE_OVERLAY_SECRET"
          test -s meloasis-source-build52.enc
          OVERLAY_ARCHIVE="$RUNNER_TEMP/cadentide-source-overlay.zip"
          OVERLAY_ROOT="$RUNNER_TEMP/cadentide-source-overlay"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in meloasis-source-build52.enc \
            -out "$OVERLAY_ARCHIVE" \
            -pass env:CADENTIDE_OVERLAY_SECRET
          mkdir -p "$OVERLAY_ROOT"
          unzip -q "$OVERLAY_ARCHIVE" -d "$OVERLAY_ROOT"
          OVERLAY_ROOT="$OVERLAY_ROOT" python3 - <<'PY'
          import hashlib, json, os, pathlib
          provenance = json.loads(pathlib.Path('MELOASIS_RELEASE_PROVENANCE.json').read_text())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest().upper()
          assert digest(pathlib.Path('meloasis-source-build52.enc')) == provenance['encryptedOverlaySHA256']
          assert digest(pathlib.Path('cadentide-project.enc')) == provenance['signingPayloadSHA256']
          root = pathlib.Path(os.environ['OVERLAY_ROOT']) / 'products/cadentide/ios'
          manifest_path = root / 'SOURCE_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['build'] == 52 and manifest['version'] == '4.5'
          assert provenance['build'] == manifest['build'] and provenance['version'] == manifest['version']
          assert provenance['expectedNativeTests'] == manifest['expectedNativeTests']
          assert len(manifest['files']) == provenance['sourceFileCount']
          for entry in manifest['files']:
              path = (root / entry['path']).resolve()
              assert path.is_relative_to(root.resolve())
              assert path.stat().st_size == entry['bytes'] and digest(path) == entry['sha256']
          print('Verified encrypted source provenance:', len(manifest['files']), 'files')
          PY
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide.xcodeproj/project.pbxproj"
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide/ContentView.swift"
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide/Game/GameScene.swift"
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide/Visual/CadentideMetaComponents.swift"
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide/Visual/CadentideVisualSystem.swift"
          test -s "$OVERLAY_ROOT/products/cadentide/ios/Cadentide/Visual/CadentideVisualLab.swift"
          rm -rf products/cadentide/ios
          mv "$OVERLAY_ROOT/products/cadentide/ios" products/cadentide/ios

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Verify version and build settings
        run: |
          set -euo pipefail
          for CONFIGURATION in Debug Release; do
            SETTINGS="$RUNNER_TEMP/cadentide-$CONFIGURATION-settings.txt"
            xcodebuild -showBuildSettings \
              -project ios/Cadentide.xcodeproj \
              -scheme Cadentide \
              -configuration "$CONFIGURATION" > "$SETTINGS"
            grep -Eq "MARKETING_VERSION = ${CADENTIDE_MARKETING_VERSION}$" "$SETTINGS"
            grep -Eq "CURRENT_PROJECT_VERSION = ${CADENTIDE_BUILD_NUMBER}$" "$SETTINGS"
            grep -Eq 'IPHONEOS_DEPLOYMENT_TARGET = 17.0$' "$SETTINGS"
          done

      - name: Run native unit tests
        run: |
          set -euo pipefail
          if grep -R -qE '^import (StoreKit|AdSupport|AppTrackingTransparency|WebKit|Network)$|URLSession|GADMobileAds|FirebaseAnalytics|FBSDK|AppsFlyer|Adjust([[:space:]]|SDK|\.framework)' ios/Cadentide --include='*.swift'; then
            echo "Unexpected network, advertising, tracking or commerce code found." >&2
            exit 1
          fi
          grep -q '<key>NSPrivacyTracking</key>' ios/Cadentide/PrivacyInfo.xcprivacy
          grep -A1 '<key>NSPrivacyTracking</key>' ios/Cadentide/PrivacyInfo.xcprivacy | grep -q '<false/>'
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          mkdir -p build "$RUNNER_TEMP/meloasis-private-evidence"
          xcodebuild test \
            -project ios/Cadentide.xcodeproj \
            -scheme Cadentide \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/HardeningTests.xcresult \
            -only-testing:CadentideTests/GameCoreTests/testLegacyEndlessCheckpointRebasesKillsWithoutInstantRewardsAndSurvivesRelaunch \
            -only-testing:CadentideTests/GameCoreTests/testVersionedAndUnrelatedEndlessContractsKeepTheirExistingProgress \
            -only-testing:CadentideTests/GameCoreTests/testLiveEquipSaveRoundtripPreservesOrderedVolleyAdmissionAtProjectileCap \
            -only-testing:CadentideTests/GameCoreTests/testLegacyMedalSaveKeepsMeaningAndRewardsThroughUpgradeExportAndRelaunch \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/meloasis-private-evidence/hardening-build.log" 2>&1 || { echo 'Hardening gate failed; encrypted diagnostics will be preserved.'; exit 1; }
          xcodebuild test \
            -project ios/Cadentide.xcodeproj \
            -scheme Cadentide \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/CadentideTests.xcresult \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/meloasis-private-evidence/native-build.log" 2>&1 || { echo 'Full native gate failed; encrypted diagnostics will be preserved.'; exit 1; }
          xcrun xcresulttool get test-results summary --path build/HardeningTests.xcresult > build/hardening-test-summary.json
          xcrun xcresulttool get test-results summary --path build/CadentideTests.xcresult > build/native-test-summary.json
          EXPECTED_TESTS="$(grep -R -E '^[[:space:]]*func test' ios/CadentideTests --include='*.swift' | wc -l | tr -d ' ')"
          RECEIPT_TESTS="$(python3 -c "import json; print(json.load(open('../../MELOASIS_RELEASE_PROVENANCE.json'))['expectedNativeTests'])")"
          test "$EXPECTED_TESTS" = "$RECEIPT_TESTS"
          test "$EXPECTED_TESTS" -ge 208
          ruby -rjson -e 's=JSON.parse(File.read(ARGV[0])); abort "Hardening test gate failed" unless s.fetch("passedTests") == 4 && s.fetch("failedTests") == 0 && s.fetch("skippedTests") == 0' build/hardening-test-summary.json
          ruby -rjson -e 's=JSON.parse(File.read(ARGV[0])); abort "Native test count/failures mismatch" unless s.fetch("passedTests") == ARGV[1].to_i && s.fetch("failedTests") == 0 && s.fetch("skippedTests") == 0' build/native-test-summary.json "$EXPECTED_TESTS"

      - name: Export native visual evidence
        if: always()
        run: |
          if [ -d build/CadentideTests.xcresult ]; then
            mkdir -p "$RUNNER_TEMP/meloasis-private-evidence"
            xcrun xcresulttool export attachments --path build/CadentideTests.xcresult --output-path "$RUNNER_TEMP/meloasis-private-evidence/visual-qa"
          fi

      - name: Install private signing identity
        env:
          SIGNING_DIRECTORY: ${{ github.workspace }}/signing
        run: |
          set -euo pipefail
          P12_PASSWORD="$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0])).fetch("certificatePassword")' "$SIGNING_DIRECTORY/credentials.json")"
          echo "::add-mask::$P12_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/cadentide-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIRECTORY/dist-cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/cadentide-profile.plist"
          security cms -D -i "$SIGNING_DIRECTORY/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          test "$TEAM_ID" = "582X9U27VU"
          test "$APPLICATION_ID" = "582X9U27VU.com.hzproductionz432.cadentide"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST" | \
            grep -q '00008150-000471841A41401C'

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGNING_DIRECTORY/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"/\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"
          {
            echo "CADENTIDE_KEYCHAIN=$KEYCHAIN_PATH"
            echo "CADENTIDE_PROFILE_NAME=$PROFILE_NAME"
            echo "CADENTIDE_TEAM_ID=$TEAM_ID"
            echo "CADENTIDE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Cadentide.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/cadentide-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/CadentideExportOptions.plist"
          mkdir -p build "$EXPORT_PATH"

          xcodebuild archive \
            -project ios/Cadentide.xcodeproj \
            -scheme Cadentide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$CADENTIDE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CADENTIDE_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$CADENTIDE_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $CADENTIDE_KEYCHAIN" > "$RUNNER_TEMP/meloasis-private-evidence/archive.log" 2>&1 || { echo 'Release archive failed; encrypted diagnostics will be preserved.'; exit 1; }

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingCertificate</key>
            <string>${CADENTIDE_SIGNING_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${CADENTIDE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hzproductionz432.cadentide</key>
              <string>${CADENTIDE_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            OTHER_CODE_SIGN_FLAGS="--keychain $CADENTIDE_KEYCHAIN" > "$RUNNER_TEMP/meloasis-private-evidence/export.log" 2>&1 || { echo 'IPA export failed; encrypted diagnostics will be preserved.'; exit 1; }

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' | head -n 1)"
          test -s "$IPA_PATH"
          cp "$IPA_PATH" build/Cadentide.ipa

      - name: Verify signed Meloasis application
        run: |
          set -euo pipefail
          test -s build/Cadentide.ipa
          CHECK_DIR="$RUNNER_TEMP/cadentide-ipa-check"
          mkdir -p "$CHECK_DIR"
          unzip -q build/Cadentide.ipa -d "$CHECK_DIR"
          APP_PATH="$(find "$CHECK_DIR/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "com.hzproductionz432.cadentide"
          test "$DISPLAY_NAME" = "Meloasis"
          test "$VERSION" = "$CADENTIDE_MARKETING_VERSION"
          test "$BUILD_NUMBER" = "$CADENTIDE_BUILD_NUMBER"
          for SOUND in \
            boss.wav chain.wav checkpoint.wav \
            defeat.wav defeat_alt.wav defeat_soft.wav failure.wav \
            hit.wav hit_alt.wav \
            pearl.wav pearl_alt.wav pearl_soft.wav \
            shot_fan.wav shot_lance.wav shot_spool.wav \
            tide.wav tide_alt.wav victory.wav \
            music_tidebed.wav music_current.wav music_boss_current.wav
          do
            test -s "$APP_PATH/$SOUND"
          done
          test ! -e "$APP_PATH/cadentide_ocean_floor_v1.png"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo 'Strict application signature verified'
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$CHECK_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$CHECK_DIR/profile.plist" | \
            grep -q '00008150-000471841A41401C'
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$CHECK_DIR/profile.plist")"
          test "$TEAM_ID" = "582X9U27VU"
          echo 'Registered-device provisioning and team verified'
          codesign -d --entitlements :- "$APP_PATH" > "$CHECK_DIR/app-entitlements.plist"
          APPLICATION_ID="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$CHECK_DIR/app-entitlements.plist")"
          test "$APPLICATION_ID" = "582X9U27VU.com.hzproductionz432.cadentide"
          echo 'Application entitlement identity verified'
          # The optional prefix must be bound to this long option, not parsed as another code path.
          codesign -d --extract-certificates="$CHECK_DIR/signer" "$APP_PATH"
          test -s "$CHECK_DIR/signer0"
          echo 'Leaf signing certificate extracted'
          python3 - "$CHECK_DIR/profile.plist" "$CHECK_DIR/app-entitlements.plist" "$APP_PATH/Info.plist" "$CHECK_DIR/signer0" <<'PY'
          import datetime, hashlib, json, pathlib, plistlib, subprocess, sys
          profile, entitlements, info = [plistlib.load(open(path, 'rb')) for path in sys.argv[1:4]]
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          assert profile['ExpirationDate'] > now
          assert profile['Entitlements'].get('get-task-allow', False) is False
          assert entitlements.get('get-task-allow', False) is False
          assert not profile.get('ProvisionsAllDevices', False)
          assert info['MinimumOSVersion'] == '17.0'
          certificate = pathlib.Path(sys.argv[4]).read_bytes()
          assert certificate in profile['DeveloperCertificates'], 'App signer does not match provisioning'
          dates = subprocess.check_output(['openssl', 'x509', '-inform', 'DER', '-in', sys.argv[4], '-noout', '-startdate', '-enddate'], text=True)
          parsed = dict(line.split('=', 1) for line in dates.strip().splitlines())
          valid_from, valid_until = [datetime.datetime.strptime(parsed[key], '%b %d %H:%M:%S %Y %Z') for key in ['notBefore', 'notAfter']]
          assert valid_from <= now < valid_until, 'Signing certificate is not currently valid'
          ipa = pathlib.Path('build/Cadentide.ipa').read_bytes()
          report = dict(checkedAtUTC=now.isoformat()+'Z', build=info['CFBundleVersion'],
                        version=info['CFBundleShortVersionString'], bundle=info['CFBundleIdentifier'],
                        ipaBytes=len(ipa), ipaSHA256=hashlib.sha256(ipa).hexdigest().upper(),
                        codesignStrict='passed', releaseEntitlements='passed', registeredDevice='passed',
                        certificateMatchesProfile=True, certificateValidFromUTC=valid_from.isoformat()+'Z',
                        certificateValidUntilUTC=valid_until.isoformat()+'Z', profileExpiresUTC=profile['ExpirationDate'].isoformat()+'Z',
                        certificateRevocation='not independently verified', physicalIPhoneQA='not performed')
          pathlib.Path('build/signing-verification.json').write_text(json.dumps(report, indent=2)+'\n')
          print('Profile and certificate validity, signer match, release entitlements and minimum iOS verified')
          PY
          echo "Verified Meloasis ${CADENTIDE_MARKETING_VERSION} (${CADENTIDE_BUILD_NUMBER}) for the registered iPhone."

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadentide-ios
          path: products/cadentide/build/Cadentide.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Create release manifest
        run: |
          set -euo pipefail
          test -s build/Cadentide.ipa
          IPA_SIZE="$(stat -f '%z' build/Cadentide.ipa)"
          IPA_SHA256="$(shasum -a 256 build/Cadentide.ipa | awk '{print $1}')"
          TEST_COUNT="$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0])).fetch("passedTests")' build/native-test-summary.json)"
          cat > build/RELEASE_MANIFEST.md <<MANIFEST
          # Meloasis ${CADENTIDE_MARKETING_VERSION} build ${CADENTIDE_BUILD_NUMBER}

          - Commit: ${GITHUB_SHA}
          - Ref: ${GITHUB_REF}
          - Workflow run: ${GITHUB_RUN_ID}
          - Native XCTest passed (xcresult): ${TEST_COUNT}; failed: 0; skipped: 0
          - IPA bytes: ${IPA_SIZE}
          - IPA SHA-256: ${IPA_SHA256}
          - Bundle: com.hzproductionz432.cadentide
          - Minimum iOS: 17.0
          - Signed ad-hoc: verified
          - Registered iPhone profile: verified
          - Installer publication: separate HTTPS page/manifest/IPA verification required
          - Physical iPhone QA: not performed
          MANIFEST
          cat build/RELEASE_MANIFEST.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadentide-ios-install
          path: |
            products/cadentide/build/signing-verification.json
            products/cadentide/build/RELEASE_MANIFEST.md
            products/cadentide/build/native-test-summary.json
            products/cadentide/build/hardening-test-summary.json
          if-no-files-found: error
          retention-days: 3

      - name: Encrypt private native test results
        if: always()
        env:
          SOURCE_KEY: ${{ secrets.MELOASIS_SOURCE_VERIFY_45_BUILD52_20260923 }}
        run: |
          set -euo pipefail
          PRIVATE="$RUNNER_TEMP/meloasis-private-evidence"
          mkdir -p "$PRIVATE" build
          for RESULT in build/CadentideTests.xcresult build/HardeningTests.xcresult; do
            if [ -d "$RESULT" ]; then
              ditto "$RESULT" "$PRIVATE/$(basename "$RESULT")"
            fi
          done
          ditto -c -k --keepParent "$PRIVATE" "$RUNNER_TEMP/meloasis-release-evidence.zip"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/meloasis-release-evidence.zip" -out build/meloasis-release-evidence-build52.enc -pass env:SOURCE_KEY

      - name: Preserve encrypted native test results
        if: always()
