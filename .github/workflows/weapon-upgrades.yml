name: Unsigned weapon upgrade verification
on:
  push:
    branches: [codex/cadentide-weapon-upgrades]
    paths: [cadentide-weapon-upgrades.enc, WEAPON_UPGRADE_PROVENANCE.json, .github/workflows/weapon-upgrades.yml]
permissions:
  contents: read
concurrency:
  group: cadentide-weapon-upgrades-tests
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Decrypt and verify source only
        env:
          SOURCE_KEY: ${{ secrets.CADENTIDE_WEAPON_UPGRADE_TEST_SECRET }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in cadentide-weapon-upgrades.enc -out "$RUNNER_TEMP/source.zip" -pass env:SOURCE_KEY
          unzip -q "$RUNNER_TEMP/source.zip"
          python3 - <<'PY'
          import hashlib, json, pathlib
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest().upper()
          provenance = json.loads(pathlib.Path('WEAPON_UPGRADE_PROVENANCE.json').read_text())
          assert digest(pathlib.Path('cadentide-weapon-upgrades.enc')) == provenance['encryptedOverlaySHA256']
          root = pathlib.Path('products/cadentide/ios').resolve()
          manifest = root / 'SOURCE_MANIFEST.json'
          assert digest(manifest) == provenance['sourceManifestSHA256']
          data = json.loads(manifest.read_text())
          for entry in data['files']:
              file = (root / entry['path']).resolve()
              assert file.is_relative_to(root) and file.stat().st_size == entry['bytes']
              assert digest(file) == entry['sha256']
          assert not pathlib.Path('signing').exists()
          print('Source-only provenance verified:', len(data['files']), 'files')
          PY
      - name: Native simulator build and full tests
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /(Shutdown|Booted)/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          mkdir -p evidence
          xcrun simctl list devices available > evidence/simulators.txt
          xcodebuild test -project products/cadentide/ios/Cadentide.xcodeproj -scheme Cadentide -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath evidence/Tests.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary --path evidence/Tests.xcresult > evidence/tests.json
          EXPECTED_TESTS="$(grep -R -E '^[[:space:]]*func test' products/cadentide/ios/CadentideTests --include='*.swift' | wc -l | tr -d ' ')"
          ruby -rjson -e 's=JSON.parse(File.read(ARGV[0])); abort "Test gate failed" unless s.fetch("passedTests") == ARGV[1].to_i && s.fetch("failedTests") == 0 && s.fetch("skippedTests") == 0' evidence/tests.json "$EXPECTED_TESTS"
      - name: Export native evidence even after a failed assertion
        if: always()
        run: |
          if [ -d evidence/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path evidence/Tests.xcresult > evidence/tests.json
            xcrun xcresulttool export attachments --path evidence/Tests.xcresult --output-path evidence/attachments
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: weapon-upgrades-verification
          path: evidence
          retention-days: 14
